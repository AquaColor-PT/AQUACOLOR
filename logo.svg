<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160" role="img" aria-label="AquaColor logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66bb6a"/>
      <stop offset="1" stop-color="#2e7d32"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e7d32"/>
      <stop offset="0.7" stop-color="#43a047"/>
      <stop offset="1" stop-color="#fbc02d"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(6,4)">
    <!-- Water / paint droplet -->
    <path d="M70 12 C70 12 28 58 28 88 A42 42 0 0 0 112 88 C112 58 70 12 70 12 Z" fill="url(#drop)"/>
    <!-- Highlight -->
    <path d="M48 84 C48 70 56 58 64 48" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round"/>
    <!-- Lightning bolt (electrical / power) -->
    <polygon points="78,62 56,96 69,96 62,122 86,84 72,84" fill="#ffffff"/>
    <!-- Sun (solar) -->
    <g transform="translate(122,26)">
      <circle r="9" fill="#fbc02d"/>
      <g stroke="#fbc02d" stroke-width="3" stroke-linecap="round">
        <line x1="0" y1="-15" x2="0" y2="-19"/>
        <line x1="0" y1="15" x2="0" y2="19"/>
        <line x1="-15" y1="0" x2="-19" y2="0"/>
        <line x1="15" y1="0" x2="19" y2="0"/>
        <line x1="-10.6" y1="-10.6" x2="-13.4" y2="-13.4"/>
        <line x1="10.6" y1="-10.6" x2="13.4" y2="-13.4"/>
        <line x1="-10.6" y1="10.6" x2="-13.4" y2="13.4"/>
        <line x1="10.6" y1="10.6" x2="13.4" y2="13.4"/>
      </g>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="162" y="82" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="2">
    <tspan fill="#2e7d32">AQUA</tspan><tspan fill="#43a047">COLOR</tspan>
  </text>

  <!-- Colour stripe -->
  <rect x="164" y="96" width="372" height="6" rx="3" fill="url(#stripe)"/>

  <!-- Tagline -->
  <text x="164" y="128" font-family="Poppins, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3.2" fill="#5f6f61">
    PAINT • POWER • SOLAR • PROJECTS
  </text>
</svg>
