<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Our Projects - AquaColor</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 20px;
      background: #f7f9fb;
      color: #333;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }
    h1 {
      color: #2e7d32;
    }
    a {
      color: #2e7d32;
      text-decoration: none;
      font-weight: 600;
    }
    .gallery {
      margin-top: 30px;
    }
    .project {
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
      padding: 15px;
      margin-bottom: 30px;
    }
    .project h3 {
      color: #2e7d32;
      margin-bottom: 15px;
    }
    .images-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }
    .images-row div {
      flex: 1;
      text-align: center;
    }
    .images-row img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }
    .images-row p {
      font-weight: 600;
      color: #2e7d32;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h1>Our Projects</h1>
  <p>Here are some of the transformations we’ve delivered for our clients.</p>
  <p><a href="index.html">← Back to Home</a></p>

  <div class="gallery" id="gallery">Loading projects...</div>

  <script>
    fetch('projects.json')
      .then(response => {
        if (!response.ok) throw new Error("Could not load projects.json");
        return response.json();
      })
      .then(projects => {
        const gallery = document.getElementById('gallery');
        if (projects.length === 0) {
          gallery.innerHTML = "<p>No projects available at the moment.</p>";
          return;
        }
        gallery.innerHTML = '';
        projects.forEach(project => {
          const div = document.createElement('div');
          div.className = 'project';

          div.innerHTML = `
            <h3>${project.name}</h3>
            <div class="images-row">
              <div>
                <img src="${project.before}" alt="Before - ${project.name}" />
                <p>Before</p>
              </div>
              <div>
                <img src="${project.after}" alt="After - ${project.name}" />
                <p>After</p>
              </div>
            </div>
          `;
          gallery.appendChild(div);
        });
      })
      .catch(err => {
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = "<p>Failed to load projects.</p>";
        console.error(err);
      });
  </script>
</body>
</html>
